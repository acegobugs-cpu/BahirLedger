spring.application.name=BahirLedgerBackend
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.mvc.log-request-details=false
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
# No embedded database fallback; the DataSource is explicitly validated/created.
bahirledger.database.url=jdbc:postgresql://localhost:5433/bahir_ledger
bahirledger.database.username=bahir_ledger
bahirledger.database.password=bahir_ledger
# Empty means no cross-origin browser access outside the local profile.
bahirledger.auth.web-origin=${BAHIRLEDGER_WEB_ORIGIN:}

# Delivery is opt-in; unconfigured delivery fails closed, never verifies an account.
bahirledger.mail.mode=${BAHIRLEDGER_MAIL_MODE:disabled}
bahirledger.mail.verification-web-origin=${BAHIRLEDGER_VERIFICATION_WEB_ORIGIN:}
bahirledger.mail.smtp.host=${BAHIRLEDGER_SMTP_HOST:}
bahirledger.mail.smtp.port=${BAHIRLEDGER_SMTP_PORT:587}
bahirledger.mail.smtp.from=${BAHIRLEDGER_SMTP_FROM:}
bahirledger.mail.smtp.username=${BAHIRLEDGER_SMTP_USERNAME:}
bahirledger.mail.smtp.password=${BAHIRLEDGER_SMTP_PASSWORD:}
bahirledger.mail.smtp.starttls=${BAHIRLEDGER_SMTP_STARTTLS:true}
