# PRIVATE local configuration. Git ignores this file; commit only application.properties.example.
# Paste your Gmail APP password below in this editor, not in chat. No script or env setup needed.
spring.application.name=BahirLedgerBackend
server.forward-headers-strategy=none
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.mvc.log-request-details=false
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
# No embedded database fallback; the DataSource is explicitly validated/created.
bahirledger.database.url=jdbc:postgresql://localhost:5433/bahir_ledger
bahirledger.database.username=bahir_ledger
bahirledger.database.password=bahir_ledger
# Empty means no cross-origin browser access outside the local profile.
bahirledger.auth.web-origin=http://localhost:8765

# Gmail SMTP. Set the app password before starting; blank intentionally fails closed.
bahirledger.mail.mode=smtp
bahirledger.mail.allow-loopback-http=true
bahirledger.mail.verification-web-origin=http://localhost:8765
bahirledger.mail.smtp.host=smtp.gmail.com
bahirledger.mail.smtp.port=587
bahirledger.mail.smtp.from=tsukiunomey@gmail.com
bahirledger.mail.smtp.username=tsukiunomey@gmail.com
# REQUIRED: paste the 16-character Google app password without grouping spaces after '='.
# Java properties require literal backslashes to be doubled (Gmail app passwords use letters).
bahirledger.mail.smtp.password=kqbxccqaqxxwpgpq
bahirledger.mail.smtp.starttls=true
