openapi: 3.1.0
info:
  title: BahirLedger Managed Authentication
  version: 0.3.0
  description: >-
    BahirLedger-managed email/password sign-in is the default. Organization SSO is a
    future optional feature, not an available login mode. Registration, login and process
    liveness are public application operations. Listed browser CORS preflights are
    also permitted for the exact configured loopback origin. All other routes and
    methods are denied. Email verification requires an active account-only bearer session.
    No membership, refresh or business API is exposed; verification grants no tenant access.
    Use HTTPS outside loopback development. Clients must keep access tokens only
    in memory, including on web: never cookies, localStorage, URLs or logs.
security:
  - bearerSession: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Process liveness, not database or identity-provider readiness
      security: []
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: UP
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate with a BahirLedger-managed account
      security: []
      description: >-
        Email is stripped of surrounding whitespace and lowercased with a
        locale-independent rule before validation and lookup. Password is not
        trimmed. Wrong password, unknown account and inactive account have the
        identical 401 response. JSON body is limited to 4096 bytes including
        chunked requests. Password verification uses BCrypt cost 12; a dummy
        verification is performed for unknown accounts. No cookie is created.
        Login is CSRF-exempt because no ambient cookie authentication exists.
        Tokens expire absolutely 30 minutes after issuance, without refresh.
        All sessions are lost on backend restart. Unverified accounts may log in;
        login does not send email or implicitly verify ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  minLength: 1
                  maxLength: 254
                  description: Constraints apply after normalization.
                password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 1
                  maxLength: 72
                  description: Nonblank; additionally at most 72 UTF-8 bytes (BCrypt limit).
      responses:
        '200':
          description: Authenticated; the raw token is returned only in this response
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accessToken, expiresAt, user]
                properties:
                  accessToken:
                    type: string
                    pattern: '^[A-Za-z0-9_-]{43}$'
                    description: Opaque bearer token from 32 cryptographically random bytes; not a JWT.
                  expiresAt:
                    type: string
                    format: date-time
                    description: Absolute UTC ISO-8601 timestamp ending in Z.
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Wrong password, unknown account or inactive account
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: invalid_credentials
                message: Email or password is incorrect.
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Create a managed account and issue an account-only session
      security: []
      description: >-
        Email is normalized as for login. Password is not trimmed. This exact POST
        route is CSRF-exempt without cookie authentication and shares login's
        source/email throttles, concurrency cap and 4096-byte body limit.
        The account starts with emailVerified false. Automatically attempts verification
        email delivery before issuing a session. Mail unavailable returns 503 without a
        session; the pending account may remain. Log in and resend after cooldown,
        rather than registering again. Duplicate registration (including a constraint
        race) returns 409 and sends no mail. No organization membership or project
        access is granted. A 200 means configured delivery accepted the email,
        not that the email reached the inbox or that the account is verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 72
                  description: Must not be blank.
                password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 1
                  maxLength: 72
                  description: Nonblank and at most 72 UTF-8 bytes.
      responses:
        '200':
          description: Account created with a 30-minute session; no cookie or tenant grants
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresAt, user]
                properties:
                  accessToken:
                    type: string
                    pattern: '^[A-Za-z0-9_-]{43}$'
                  expiresAt:
                    type: string
                    format: date-time
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already registered
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {code: conflict, message: 'Email is already registered.'}
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/email-verification/confirm:
    post:
      operationId: confirmEmailVerification
      summary: Verify email ownership for the current active account
      description: >-
        Requires the current bearer, even when the email link is opened. JSON is
        bounded to 4096 bytes before parsing, including chunked requests. Token is
        43 base64url characters from 32 random bytes, valid strictly before its
        30-minute expiry. Invalid, expired, replayed, rotated and wrong-account
        tokens have the same generic 400 response. Confirmation atomically consumes
        the token and sets emailVerified true. Does not extend or replace the
        bearer session or grant membership. Exact POST-only CSRF exception.
        Five-minute confirm budgets are 10 per account, 20 per direct source and
        100 globally, including malformed authenticated requests and successes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  writeOnly: true
                  pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        '200':
          description: Updated identity, same shape as GET /api/v1/me; emailVerified is true
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: >-
            Invalid/expired/replayed/wrong-account token uses invalid_verification_token.
            Malformed/missing JSON, unsupported media type or oversized body uses invalid_request.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                token:
                  value: {code: invalid_verification_token, message: 'Verification token is invalid or expired.'}
                body:
                  value: {code: invalid_request, message: 'Request is invalid.'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/email-verification/resend:
    post:
      operationId: resendEmailVerification
      summary: Send a new verification email for the current active account
      description: >-
        No request body (nonempty bodies return 400). Requires the current bearer.
        Already verified is a 204 no-op without email. Otherwise 204 means configured
        delivery accepted the email, not inbox receipt. Rotates the previous token;
        persistent per-account cooldown is 60 seconds, including delivery failures.
        Failure returns 503, leaves the account pending and invalidates the previous
        token. Five-minute resend budgets are 3 attempts per unverified account,
        10 per direct source and 30 globally, including rejected requests. Source
        budgets also apply to verified no-ops. Exact POST-only CSRF exception.
      responses:
        '204':
          description: Email accepted by configured delivery, or already verified; empty response
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Current active account identity, not membership information
      responses:
        '200':
          description: Active account identified by the current bearer session
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke only the current bearer session
      description: >-
        No request body required. Other sessions remain valid. Missing, invalid,
        expired, previously revoked tokens or inactive accounts return 401.
        CSRF-exempt only for this exact POST route; no cookie authentication exists.
      responses:
        '204':
          description: Current session revoked; empty response body
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        One Authorization header with Bearer followed by the token. No cookies,
        query-string tokens, HTTP Basic, form login or implicit development accounts.
  headers:
    NoStore:
      description: Authentication and identity responses must never be cached.
      schema:
        type: string
        const: no-store
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName, emailVerified]
      properties:
        id:
          type: string
          format: uuid
          description: Stable account ID persisted in the database.
        email:
          type: string
          format: email
          maxLength: 254
          description: Unique normalized email.
        displayName:
          type: string
          maxLength: 120
        emailVerified:
          type: boolean
          description: Required email ownership flag. Defaults false for new, migrated and locally provisioned accounts; not a membership grant.
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_request, invalid_verification_token, invalid_credentials, unauthorized, forbidden, conflict, too_many_requests, service_unavailable, internal_error]
        message:
          type: string
          description: Fixed generic message; never request values, credentials or exception details.
  responses:
    InvalidRequest:
      description: Invalid/missing JSON or fields, excessive byte length, or unsupported media type
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {code: invalid_request, message: 'Request is invalid.'}
    Unauthorized:
      description: Missing, malformed, invalid, expired, revoked bearer token, or inactive account
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {code: unauthorized, message: 'Authentication is required.'}
    Forbidden:
      description: Route, method, CORS policy or CSRF check does not permit the request
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {code: forbidden, message: 'Request is not permitted.'}
    Throttled:
      description: >-
        Bounded per-process fixed five-minute windows: 5 attempts per normalized
        email, 20 per direct source IP, 100 globally, including successful logins.
        Malformed requests count against source/global limits. Forwarded IP headers
        are not trusted. Also returned if four concurrent password checks or the
        10000-entry session/throttle capacity is saturated. Verification has separate
        route-specific budgets, four concurrent mail operations, and a durable
        60-second per-account resend cooldown. No Retry-After guarantee.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {code: too_many_requests, message: 'Too many requests. Try again later.'}
    Unavailable:
      description: Database or configured mail delivery unavailable (including disabled mail); no exception details
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {code: service_unavailable, message: 'Service is temporarily unavailable.'}
    InternalError:
      description: Unexpected application error; no exception details
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {code: internal_error, message: 'Request could not be completed.'}